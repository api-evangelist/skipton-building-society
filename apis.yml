name: Skipton Building Society
kind: company
description: >-
  Skipton Building Society is a UK mutual building society founded in 1853 and
  headquartered in Skipton, North Yorkshire. It is the fourth-largest building
  society in the United Kingdom, owned by and run for the benefit of its members
  rather than shareholders, and is the parent of the wider Skipton Group (which
  includes the Connells estate-agency group and Skipton International). Skipton
  is authorised by the Prudential Regulation Authority (PRA) and regulated by
  the Financial Conduct Authority (FCA) and PRA, and is a member of the Building
  Societies Association. Its core business is retail savings and residential
  mortgages together with financial advice; it does not offer personal current
  accounts. Within UK Open Banking (PSD2 / OBIE) Skipton has historically acted
  as a consumer of Open Banking data - notably using Experian's Open Banking
  service to verify mortgage-affordability from applicant bank data - rather than
  as an account-servicing payment service provider (ASPSP) publishing a public
  developer platform. As of this profile Skipton exposes no public developer
  portal and is not listed among the CMA9 or the wider set of banks and building
  societies that publish live UK Open Banking Open Data or Read/Write APIs; the
  Open Banking API entries below are represented as the shared OBIE standard the
  society would conform to if it published these surfaces, and are explicitly
  unverified for Skipton.
