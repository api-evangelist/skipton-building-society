- aid: skipton-building-society:skipton-open-data-api
  name: Skipton Open Banking Open Data API (OBIE Standard)
  description: >-
    UK Open Banking Open Data standard - public, unauthenticated reference data
    (branches, ATMs, personal and business current accounts, unsecured SME loans,
    commercial credit cards) as defined by the OBIE Open Data API specification.
    Represented here as the shared OBIE standard; a live Skipton Open Data host
    was NOT confirmed (see review.yml).
  humanURL: https://openbankinguk.github.io/opendata-api-docs-pub/v2.4.0/
  tags:
